# Pushed tag -> tested, reproducibly built binaries with published checksums.
# Customers never deploy a moving tag: every release is a pinned tag, a set of
# binaries anyone can rebuild byte-for-byte, and a SHA256SUMS to verify them
# against. The README's "Verifying a release" section documents the customer
# side. Official tooling only; actions pinned to commit SHAs.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build reproducibly for every target
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${target%/*} goarch=${target#*/}
            ext=""; [ "$goos" = windows ] && ext=".exe"
            out="dist/consus-local-log_${GITHUB_REF_NAME}_${goos}_${goarch}${ext}"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o "$out" .
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Built reproducibly with $(go version | cut -d' ' -f3): anyone can rebuild these binaries byte-for-byte — see \"Verifying a release\" in the README. Verify downloads with \`sha256sum -c SHA256SUMS --ignore-missing\`. Changes: CHANGELOG.md."
