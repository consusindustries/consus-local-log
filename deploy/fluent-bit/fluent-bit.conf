# Fluent Bit shipper: tails the Local Log directory into your SIEM.
# Pair with consus-parsers.conf (same directory). Any shipper that tails
# files works the same way — the log is plain JSONL, one object per line.

[SERVICE]
    flush            5
    parsers_file     consus-parsers.conf
    storage.path     /var/lib/fluent-bit/buffer

[INPUT]
    name             tail
    tag              consus.locallog
    path             /var/log/consus/*.jsonl
    parser           consus_jsonl
    read_from_head   false
    refresh_interval 10
    # A single line can approach 2x LOCALLOG_MAX_CAPTURE; size accordingly.
    buffer_max_size  64M
    skip_long_lines  off
    db               /var/lib/fluent-bit/consus-locallog.db

# Pick one output and delete the rest. The stdout output is for validating
# the pipeline before wiring the real destination.

[OUTPUT]
    name             stdout
    match            consus.locallog

